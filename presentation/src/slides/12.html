<section class="slide s12">
  <div class="head">

  </div>
  <div class="body">

            <p class="figure">2045<span class="figure__unit">년</span></p>
            <p class="t-body c-text-2">2017년 보고서는 2055년(앞뒤 약 20년)이었는데 <span class="nowrap">2023년 판</span>에서 10년 앞당겨졌어요. 새 추정의 범위는 2030년부터&nbsp;2060년까지예요.</p>
            <p class="tags"><span class="tag" data-hue="indigo">직접</span></p>
